name: CI

on:
  push:
    branches: [main, "release/**", "feat/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      # CGO_ENABLED=0 ensures purely static binary compatible with scratch/distroless containers
      - name: Build (CGO disabled and distroless)
        shell: bash
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/spectest ./cmd/spectest

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # golang/go#81238: retry once only on random Windows Go runtime heap crash
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          first="$RUNNER_TEMP/go-test-1.log"
          if go test -p 1 -count=1 ./... 2>&1 | tee "$first"; then
            exit 0
          fi
          if ! grep -qE 'fatal error:|Exception 0x[0-9a-f]|unexpected fault address|panic called with nil argument' "$first"; then
            echo "::error::the Windows suite failed without a runtime crash signature; not retried"
            exit 1
          fi
          echo "::warning::runtime heap corruption (golang/go#81238); measuring the suite again"
          go test -p 1 -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test-2.log"

